[package]
name = "minsvg"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clean-room Rust SVG optimizer (animation-aware by default)"
repository = "https://github.com/Gromsi/minSVG"
homepage = "https://github.com/Gromsi/minSVG"
readme = "README.md"
keywords = ["svg", "optimizer", "cli"]
categories = ["command-line-utilities", "compression"]
rust-version = "1.83"
include = [
    "src/*.rs",
    "tests/*.rs",
    "tests/fixtures/*.svg",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[lib]
name = "minsvg"
path = "src/lib.rs"

[[bin]]
name = "minsvg"
path = "src/main.rs"

[features]
default = []
# Lean HTTP (tiny_http + serde_json). Not axum/tokio — those would bloat the default CLI.
#   cargo install --git https://github.com/Gromsi/minSVG --locked --features serve
serve = ["dep:tiny_http", "dep:serde_json"]

[dependencies]
clap = { version = "=4.5.32", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
thiserror = "2"
quick-xml = "0.37"
base64 = "0.22"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "webp"] }
oxipng = { version = "=9.1.5", default-features = false, features = ["parallel"] }
# Unused in source — rustc 1.83 pin (indexmap 2.12+ is edition 2024).
indexmap = { version = "=2.11.4", default-features = false }
tiny_http = { version = "=0.12.0", optional = true }
serde_json = { version = "=1.0.134", optional = true }

[[test]]
name = "serve_http"
path = "tests/serve_http.rs"
required-features = ["serve"]

[package.metadata.cargo-udeps.ignore]
normal = ["indexmap"]

# rustc 1.83-safe size profile (fat LTO + single CGU + strip).
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
